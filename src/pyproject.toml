#
# Use this configuration file to control what RobotPy packages are installed
# on your RoboRIO
#

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2027.0.0a7"

# Run tests in isolated mode to prevent hanging and weird errors
pyfrc.isolated = true

# Which extra RobotPy components should be installed
# -> equivalent to `pip install robotpy[extra1, ...]
components = [
    # "all",
    "apriltag",
    "commands2",
    # "romi",
    "sim",
    # "xrp",
]

# Other pip packages to install
requires = [
    "phoenix6==26.70.0a2",
    "robotpy-wpilib-utilities @ git+https://github.com/robotpy/robotpy-wpilib-utilities",
    "robotpy-fields==2027.0.0a7",
    "photonlibpy @ git+https://github.com/PhotonVision/photonvision.git@main#subdirectory=photon-lib/py",
    "smartunits @ git+https://github.com/Mythilllian/SmartUnits.git@main",
]

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
    "slow_integration_test: marks tests as slow integration tests",
]
addopts = "--strict-markers -v --maxfail=2"
faulthandler_timeout = 60
pythonpath = "."
testpaths = ["tests"]
xfail_strict = true